<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark deep space background -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001429" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Deep luminous glow behind the burst -->
    <radialGradient id="beaconGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0091ff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00448a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card 1 (Bottom Left) -->
    <linearGradient id="fanCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00407a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#001426" stop-opacity="0.4" />
    </linearGradient>

    <!-- Card 2 (Center) -->
    <linearGradient id="fanCard2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#001e3d" stop-opacity="0.6" />
    </linearGradient>

    <!-- Card 3 (Hero Front Glowing) -->
    <linearGradient id="fanCard3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60baff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0091ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00356b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Central Supernova Sparkle -->
    <filter id="superBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad3)" stroke="#002b54" stroke-width="2.5" />
  <circle cx="256" cy="256" r="180" fill="url(#beaconGlow3)" />

  <!-- Flashcard 1 (Left tilted) -->
  <g transform="translate(256, 300) rotate(-26) translate(-256, -300)">
    <rect x="176" y="140" width="160" height="220" rx="26" 
          fill="url(#fanCard1)" 
          stroke="#005bb5" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- Flashcard 2 (Center card) -->
  <g transform="translate(256, 280) rotate(-6) translate(-256, -280)">
    <rect x="176" y="130" width="160" height="220" rx="26" 
          fill="url(#fanCard2)" 
          stroke="#0088ff" stroke-width="2" stroke-opacity="0.7" />
  </g>

  <!-- Flashcard 3 (Right tilted - The active study card) -->
  <g transform="translate(256, 270) rotate(14) translate(-256, -270)">
    <rect x="176" y="125" width="160" height="220" rx="26" 
          fill="url(#fanCard3)" 
          stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
    <!-- Content preview on top card -->
    <rect x="200" y="160" width="50" height="8" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <rect x="200" y="180" width="105" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.5" />
    <rect x="200" y="192" width="75" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.35" />
  </g>

  <!-- Giant Radiating Lumina Starburst (The Flash / Insight moment) -->
  <g transform="translate(256, 210)" filter="url(#superBloom)">
    <!-- Starburst Glow halo -->
    <circle cx="0" cy="0" r="54" fill="#0091ff" fill-opacity="0.45" />

    <!-- 8-point Lumina Star -->
    <!-- Primary 4 rays -->
    <path d="M 0,-62 Q 0,-6 58,0 Q 0,6 0,62 Q 0,6 -58,0 Q 0,-6 0,-62 Z" fill="#ffffff" />
    
    <!-- Secondary 4 diagonal rays -->
    <path d="M 0,-34 Q 0,-4 32,0 Q 0,4 0,34 Q 0,4 -32,0 Q 0,-4 0,-34 Z" 
          transform="rotate(45)" fill="#bde3ff" fill-opacity="0.9" />

    <!-- Center pure diamond core -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Ambient glowing embers / dots of knowledge -->
  <circle cx="150" cy="160" r="3" fill="#60baff" fill-opacity="0.7" filter="url(#superBloom)" />
  <circle cx="370" cy="330" r="3.5" fill="#60baff" fill-opacity="0.8" filter="url(#superBloom)" />
  <circle cx="340" cy="140" r="2.5" fill="#ffffff" fill-opacity="0.9" filter="url(#superBloom)" />
</svg>
