/head><body class="bg-surface text-on-surface min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container pt-safe pb-safe" style="background: rgb(0, 0, 0); font-family: Inter, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0px; padding: 0px;"><main class="flex-1 flex flex-col relative w-full bg-surface" style="max-width: 390px; width: 100%; min-height: 848px; height: 100%; margin: 0px auto; background: linear-gradient(rgb(0, 21, 45) 0%, rgb(0, 0, 0) 100%); font-family: Inter, sans-serif; display: flex; flex-direction: column; justify-content: flex-start; position: relative; overflow-y: auto;"><div class="flex flex-col w-full px-6 py-4 relative select-none">
<!-- Ambient Atmospheric Backlight Glows -->
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute top-80 right-0 w-48 h-48 bg-primary/10 rounded-full blur-2xl pointer-events-none -z-10"></div>
<!-- Header / Hero Section -->
<div class="w-full flex items-center gap-3 pt-4 pb-6"><button aria-label="Go back" class="p-1 -ml-1 text-white hover:text-white/80 transition-colors flex items-center justify-center bg-transparent border-0 cursor-pointer" type="button" onclick="window.history.back()"><span class="material-symbols-outlined text-2xl">arrow_back</span></button><h1 class="text-xl font-bold text-white tracking-tight">Sign up</h1></div>
<!-- Sign Up Form Elements -->
<form class="flex flex-col gap-3.5 w-full" onsubmit="event.preventDefault();">
<!-- Full Name Input -->
<div class="relative flex items-center w-full rounded-2xl bg-white/[0.06] backdrop-blur-md transition-all duration-200 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_12px_rgba(130,177,255,0.2)]" style="border: 1px solid rgba(255, 255, 255, 0.12);">
<div class="pl-4 pr-2 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-title-lg">person</span>
</div>
<input autocomplete="name" class="w-full py-3.5 pr-4 bg-transparent text-white placeholder:text-outline font-body-md text-body-md focus:outline-none" id="name-input" placeholder="Full Name" type="text">
</div>
<!-- Email Address Input -->
<div class="relative flex items-center w-full rounded-2xl bg-white/[0.06] backdrop-blur-md transition-all duration-200 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_12px_rgba(130,177,255,0.2)]" style="border: 1px solid rgba(255, 255, 255, 0.12);">
<div class="pl-4 pr-2 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-title-lg">mail</span>
</div>
<input autocomplete="email" class="w-full py-3.5 pr-4 bg-transparent text-white placeholder:text-outline font-body-md text-body-md focus:outline-none" id="email-input" placeholder="Email address" type="email">
</div>
<!-- Password Input -->
<div class="relative flex items-center w-full rounded-2xl bg-white/[0.06] backdrop-blur-md transition-all duration-200 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_12px_rgba(130,177,255,0.2)]" style="border: 1px solid rgba(255, 255, 255, 0.12);">
<div class="pl-4 pr-2 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-title-lg">lock</span>
</div>
<input autocomplete="new-password" class="w-full py-3.5 pr-2 bg-transparent text-white placeholder:text-outline font-body-md text-body-md focus:outline-none" id="password-input" placeholder="Password" type="password">
<button aria-label="Toggle password visibility" class="pr-4 pl-2 text-on-surface-variant hover:text-white flex items-center justify-center transition-colors" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-title-lg" id="pwd-icon">visibility</span>
</button>
</div>
<!-- Confirm Password Input -->
<div class="relative flex items-center w-full rounded-2xl bg-white/[0.06] backdrop-blur-md transition-all duration-200 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_12px_rgba(130,177,255,0.2)]" style="border: 1px solid rgba(255, 255, 255, 0.12);">
<div class="pl-4 pr-2 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-title-lg">verified_user</span>
</div>
<input autocomplete="new-password" class="w-full py-3.5 pr-2 bg-transparent text-white placeholder:text-outline font-body-md text-body-md focus:outline-none" id="confirm-password-input" placeholder="Confirm password" type="password">
<button aria-label="Toggle confirm password visibility" class="pr-4 pl-2 text-on-surface-variant hover:text-white flex items-center justify-center transition-colors" id="toggle-confirm-pwd-btn" type="button">
<span class="material-symbols-outlined text-title-lg" id="confirm-pwd-icon">visibility</span>
</button>
</div>
<!-- Terms note -->

<!-- Primary CTA Button -->
<button class="mt-2 w-full rounded-full text-white font-label-lg text-label-lg flex items-center justify-center gap-2 transition-all duration-300 active:scale-[0.98] hover:opacity-95 shadow-[0_0_24px_rgba(0,145,255,0.5)] group py-3.5" id="submit-signup-btn" style="background-color: rgb(0, 145, 255);" type="submit"><span class="font-semibold">Create account</span><span class="material-symbols-outlined text-title-lg transition-transform group-hover:translate-x-1">arrow_forward</span></button>
</form>
<!-- Divider -->

<!-- Social Sign Up Options -->
<div class="w-full flex flex-col gap-2.5">

</div>
<!-- Footer Navigation Link -->
<div class="mt-6 mb-2 text-center"></div>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('password-input');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const pwdIcon = document.getElementById('pwd-icon');

    if (togglePwdBtn && pwdInput && pwdIcon) {
      togglePwdBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const confirmPwdInput = document.getElementById('confirm-password-input');
    const toggleConfirmPwdBtn = document.getElementById('toggle-confirm-pwd-btn');
    const confirmPwdIcon = document.getElementById('confirm-pwd-icon');

    if (toggleConfirmPwdBtn && confirmPwdInput && confirmPwdIcon) {
      toggleConfirmPwdBtn.addEventListener('click', () => {
        const isPassword = confirmPwdInput.type === 'password';
        confirmPwdInput.type = isPassword ? 'text' : 'password';
        confirmPwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>
