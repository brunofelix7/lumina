<script>
  (function() {
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        logoutBtn.classList.add('opacity-75');
        const originalText = logoutBtn.innerHTML;
        logoutBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Signing Out...</span>';
        setTimeout(() => {
          logoutBtn.innerHTML = originalText;
          logoutBtn.classList.remove('opacity-75');
        }, 1200);
      });
    }
  })();
